<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78876e"/></marker></defs><rect width="1400" height="930" fill="#fbfcf8"/><text x="70" y="68" font-family="Arial" font-size="14" letter-spacing="4" fill="#889477">TABLE &amp; THYME</text><text x="70" y="119" font-family="Arial" font-size="34" font-weight="bold" fill="#294b3a">From the first order to the final receipt.</text><text x="70" y="153" font-family="Arial" font-size="17" fill="#7b8871">React + Spring Boot (Java) + REST APIs + MySQL</text><rect x="70" y="220" width="350" height="120" rx="14" fill="#fff" stroke="#dce5d4" stroke-width="2"/><text x="92" y="252" font-family="Arial" font-size="15" font-weight="bold" fill="#36563e">01  REACT FRONTEND</text><text x="92" y="285" font-family="Arial" font-size="15" fill="#75816a">Menu, cart, tables &amp; kitchen</text><text x="92" y="311" font-family="Arial" font-size="13" fill="#95a086">Staff reviews and submits orders</text><rect x="525" y="220" width="350" height="120" rx="14" fill="#fff" stroke="#dce5d4" stroke-width="2"/><text x="547" y="252" font-family="Arial" font-size="15" font-weight="bold" fill="#36563e">02  SPRING BOOT API</text><text x="547" y="285" font-family="Arial" font-size="15" fill="#75816a">Validate requests &amp; apply rules</text><text x="547" y="311" font-family="Arial" font-size="13" fill="#95a086">Java services + transactions</text><rect x="980" y="220" width="350" height="120" rx="14" fill="#fff" stroke="#dce5d4" stroke-width="2"/><text x="1002" y="252" font-family="Arial" font-size="15" font-weight="bold" fill="#36563e">03  MYSQL DATABASE</text><text x="1002" y="285" font-family="Arial" font-size="15" fill="#75816a">Menu, orders, items, bills, tables</text><text x="1002" y="311" font-family="Arial" font-size="13" fill="#95a086">Persistent relational records</text><rect x="525" y="430" width="350" height="120" rx="14" fill="#fff" stroke="#dce5d4" stroke-width="2"/><text x="547" y="462" font-family="Arial" font-size="15" font-weight="bold" fill="#36563e">04  KITCHEN WORKFLOW</text><text x="547" y="495" font-family="Arial" font-size="15" fill="#75816a">Received → Preparing → Served</text><text x="547" y="521" font-family="Arial" font-size="13" fill="#95a086">Stock reserved at order placement</text><rect x="980" y="430" width="350" height="120" rx="14" fill="#fff" stroke="#dce5d4" stroke-width="2"/><text x="1002" y="462" font-family="Arial" font-size="15" font-weight="bold" fill="#36563e">OPTIONAL GEMINI API</text><text x="1002" y="495" font-family="Arial" font-size="15" fill="#75816a">Pairings &amp; typed order proposals</text><text x="1002" y="521" font-family="Arial" font-size="13" fill="#95a086">Backend-only key; local fallback</text><rect x="525" y="640" width="350" height="120" rx="14" fill="#fff" stroke="#dce5d4" stroke-width="2"/><text x="547" y="672" font-family="Arial" font-size="15" font-weight="bold" fill="#36563e">05  BILLING &amp; PAYMENT</text><text x="547" y="705" font-family="Arial" font-size="15" fill="#75816a">Calculate → Generate → Record paid</text><text x="547" y="731" font-family="Arial" font-size="13" fill="#95a086">Release table; count paid revenue</text><rect x="70" y="640" width="350" height="120" rx="14" fill="#fff" stroke="#dce5d4" stroke-width="2"/><text x="92" y="672" font-family="Arial" font-size="15" font-weight="bold" fill="#36563e">06  DIGITAL RECEIPT</text><text x="92" y="705" font-family="Arial" font-size="15" fill="#75816a">Review, print or save as PDF</text><text x="92" y="731" font-family="Arial" font-size="13" fill="#95a086">Historical prices stay unchanged</text><rect x="980" y="640" width="350" height="120" rx="14" fill="#fff" stroke="#dce5d4" stroke-width="2"/><text x="1002" y="672" font-family="Arial" font-size="15" font-weight="bold" fill="#36563e">07  SALES INSIGHTS</text><text x="1002" y="705" font-family="Arial" font-size="15" fill="#75816a">Paid revenue &amp; popular dishes</text><text x="1002" y="731" font-family="Arial" font-size="13" fill="#95a086">CSV export + low-stock watch</text><path d="M420 280 H520" fill="none" stroke="#78876e" stroke-width="2" marker-end="url(#arrow)"/><path d="M875 280 H975" fill="none" stroke="#78876e" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 340 V425" fill="none" stroke="#78876e" stroke-width="2" marker-end="url(#arrow)"/><path d="M875 300 H925 V490 H975" fill="none" stroke="#78876e" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 550 V635" fill="none" stroke="#78876e" stroke-width="2" marker-end="url(#arrow)"/><path d="M525 700 H425" fill="none" stroke="#78876e" stroke-width="2" marker-end="url(#arrow)"/><path d="M875 700 H975" fill="none" stroke="#78876e" stroke-width="2" marker-end="url(#arrow)"/><text x="70" y="845" font-family="Arial" font-size="16" fill="#647956">Order → reserve stock → prepare → serve → bill → record payment → release table</text><text x="70" y="876" font-family="Arial" font-size="13" fill="#9ba38f">Academic staff prototype · 5% demonstration tax · payment recording, not a bank gateway · AI suggestions require staff review</text></svg>